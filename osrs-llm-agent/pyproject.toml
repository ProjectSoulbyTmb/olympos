[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osrs-llm-agent"
version = "1.0.0"
description = "LLM strategic agent for a simplified OSRS-style skilling MMO; writes and benchmarks its own strategy code"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Earth949" }]
keywords = ["osrs", "llm-agent", "simulation", "strategy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["game", "server", "strategies", "tools", "agent", "knowledge"]
