name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Self-hosted (earth949-d, D:\actions-runner): zero billed minutes.
  # GitHub-hosted jobs were blocked by account billing; local-first is
  # house doctrine anyway (STRATEGY non-goals). Revert to windows-latest
  # only after billing is settled AND the ubuntu portability PR lands.
  assistant:
    runs-on: [self-hosted, Windows]
    # assistant/ is a nested repo that stays out of this checkout; the
    # detect step skips the suite when the directory is absent.
    steps:
      - uses: actions/checkout@v4
      - name: Detect assistant workspace
        id: detect
        # cmd, not bash: bash resolution proved flaky on the self-hosted
        # host; cmd is native and needs nothing from PATH.
        shell: cmd
        run: |
          if exist assistant\package.json (echo present=true>> "%GITHUB_OUTPUT%") else (echo present=false>> "%GITHUB_OUTPUT%")
      - name: Syntax sweep (lib, plugins, tests, scripts)
        if: steps.detect.outputs.present == 'true'
        working-directory: assistant
        run: node scripts/syntax-check.js
      - name: Unit tests
        if: steps.detect.outputs.present == 'true'
        working-directory: assistant
        env:
          VENUS_DATA_DIR: ${{ runner.temp }}\venus-data
        run: npm test

  ecosystem:
    runs-on: [self-hosted, Windows]
    # System toolchain (local-first doctrine): python 3.12 + node/npm are
    # provisioned on the runner host via D:\actions-runner\.env PATH.
    # Hosted setup-* actions are omitted - setup-python's HKLM registry
    # cleanup requires admin, which the self-hosted account does not have.
    steps:
      - uses: actions/checkout@v4
      - name: Static gates (syntax, dupdefs, JSON, merge markers, secrets)
        run: python safeguards/check.py --all --strict
      - name: GAIA kernel tests
        working-directory: gaia
        run: |
          npm install --no-save
          npm test
      - name: Vulcan verify gate
        run: python vulcan/verify_vulcan.py
      - name: ZEUS protection-kernel gate
        run: python zeus/verify_zeus.py
      - name: Ratatosk post-office gate
        run: python ratatosk/verify_ratatosk.py
      - name: Hades provenance gate
        run: python hades/verify_hades.py
      - name: Knowledge library gate
        run: python knowledge/verify_knowledge.py
      - name: NORN integration gate
        run: python norn/verify_norn.py
      - name: Hypnos task-organ gate
        run: python hypnos/verify_hypnos.py
      - name: PTAH builder gate
        run: python ptah/verify_ptah.py
      - name: Atlas hypervisor gate
        run: python atlas/verify_atlas.py
      - name: Safeguards gate gate
        run: python safeguards/verify_safeguards.py
      - name: Buskit contract gate
        run: python verify_buskit.py
      - name: Scope guard gate
        run: python verify_scope.py
      - name: Boundary isolation gate
        run: python verify_boundary.py
      - name: Sindri sandbox-forge gate
        run: python verify_sindri.py
      - name: Forseti arbitration gate
        run: python verify_forseti.py
      - name: Secrets hygiene gate
        run: python verify_secrets.py
      - name: Coverage floor gate
        run: python verify_coverage.py
      - name: Godot template gate
        run: python templates/verify_template.py
      - name: Learning vault integrity gate
        run: python verify_learning.py
      - name: Parallel verify gates (all suites, bounded)
        run: python safeguards/gate.py --full --timeout 600
      - name: Autopilot contract gate
        run: python verify_autopilot.py
      - name: Doctor stabilization gate
        run: python doctor.py --ci
