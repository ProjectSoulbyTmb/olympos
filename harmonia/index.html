<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HARMONIA · normalize</title>
<style>
  :root{
    --bg:#0a0f0e; --panel:#101816; --panel2:#16211e; --line:#22332e;
    --text:#e6f2ee; --dim:#8aa39b; --teal:#2dd4bf; --teal-dim:#1a7a6e;
    --amber:#ffb454; --ok:#3ecf8e; --radius:10px;
    --shadow:0 10px 30px rgba(0,0,0,.55); --tilemin:190px;
    font-size:15px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;
    overflow:hidden}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  input,select{font:inherit}

  #topbar{display:flex;align-items:center;gap:.65rem;padding:.5rem .9rem;
    background:linear-gradient(180deg,#12201c,#0d1613);
    border-bottom:1px solid var(--line);height:54px}
  #brand{font-weight:700;letter-spacing:.14em;font-size:1.05rem;
    color:var(--teal);white-space:nowrap}
  #brand small{color:var(--dim);font-weight:400;letter-spacing:.28em;
    margin-left:.45rem;font-size:.62rem;text-transform:uppercase}
  #search{flex:0 1 280px;background:var(--panel2);border:1px solid var(--line);
    border-radius:999px;color:var(--text);padding:.38rem .95rem;outline:none}
  #search:focus{border-color:var(--teal-dim)}
  .seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
  .seg button{padding:.34rem .85rem;color:var(--dim)}
  .seg button.on{background:var(--teal-dim);color:#fff}
  #sort{background:var(--panel2);border:1px solid var(--line);color:var(--text);
    border-radius:8px;padding:.32rem .5rem;outline:none}
  .tbtn{padding:.36rem .8rem;border:1px solid var(--line);border-radius:8px;
    color:var(--dim)}
  .tbtn:hover{border-color:var(--teal-dim);color:var(--text)}
  .tbtn.on{background:var(--teal-dim);border-color:var(--teal-dim);color:#fff}
  #buildstat{max-width:220px;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;color:var(--dim);font-size:.78rem}
  #count{margin-left:auto;color:var(--dim);font-size:.82rem;white-space:nowrap}

  #shell{display:flex;height:calc(100% - 54px)}
  #sidebar{width:250px;flex:0 0 250px;border-right:1px solid var(--line);
    background:var(--panel);overflow:auto;padding:.6rem .4rem 2rem}
  .fnode{display:flex;align-items:center;gap:.35rem;padding:.26rem .5rem;
    border-radius:7px;cursor:pointer;white-space:nowrap;user-select:none;
    color:var(--dim)}
  .fnode:hover{background:var(--panel2);color:var(--text)}
  .fnode.sel{background:#0f2a25;color:#b7f0e4}
  #gridwrap{flex:1;overflow-y:auto;padding:1rem 1.1rem 4rem}
  #crumbs{display:flex;flex-wrap:wrap;gap:.25rem;align-items:center;
    margin:.1rem 0 .9rem;color:var(--dim);font-size:.86rem}
  #crumbs .crumb{cursor:pointer;padding:.12rem .5rem;border-radius:6px}
  #crumbs .crumb:hover{background:var(--panel2);color:var(--text)}
  #crumbs .crumb.last{color:var(--teal);cursor:default}
  #crumbs .sep{opacity:.5}

  #grid{display:grid;gap:.7rem;
    grid-template-columns:repeat(auto-fill,minmax(var(--tilemin),1fr))}
  .tile{position:relative;margin:0;border-radius:var(--radius);overflow:hidden;
    background:var(--panel2);box-shadow:0 2px 10px rgba(0,0,0,.35);
    aspect-ratio:1/1;cursor:pointer;transition:transform .12s,box-shadow .12s}
  .tile:hover{transform:translateY(-3px);box-shadow:var(--shadow);z-index:2}
  .tile img,.tile video{width:100%;height:100%;object-fit:cover;display:block;
    background:#000}
  .tile .ph{width:100%;height:100%;display:flex;align-items:center;
    justify-content:center;font-size:2.2rem;opacity:.5}
  .tile figcaption{position:absolute;left:0;right:0;bottom:0;
    padding:1.15rem .55rem .4rem;font-size:.72rem;color:#fff;
    background:linear-gradient(180deg,transparent,rgba(0,0,0,.82));
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .badge{position:absolute;top:.45rem;right:.45rem;padding:.1rem .42rem;
    font-size:.68rem;background:rgba(0,0,0,.65);border-radius:6px;color:#fff}
  .badge.std{color:var(--ok)}
  .badge.conv{color:var(--teal)}
  .badge.raw{color:var(--amber)}
  .badge.wait{color:var(--teal);animation:pulse 1.1s infinite alternate}
  @keyframes pulse{from{opacity:.45}to{opacity:1}}
  #empty{color:var(--dim);padding:3rem 1rem;text-align:center}

  #lightbox{position:fixed;inset:0;z-index:50;background:rgba(4,8,7,.97);
    display:none;flex-direction:column}
  #lightbox.on{display:flex}
  #lbTop{display:flex;align-items:center;gap:.8rem;padding:.55rem .9rem;
    color:var(--dim);font-size:.84rem;border-bottom:1px solid #17241f}
  #lbName{color:var(--text);white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis}
  #lbNote{color:var(--teal)}
  #lbCounter{margin-left:auto;white-space:nowrap}
  #stage{flex:1;position:relative;display:flex;align-items:center;
    justify-content:center;overflow:hidden}
  #stage img,#stage video{max-width:96%;max-height:94%;border-radius:6px}
  .nav{position:absolute;top:50%;transform:translateY(-50%);font-size:2rem;
    padding:.6rem .9rem;color:var(--dim);user-select:none}
  .nav:hover{color:#fff}
  #prev{left:.4rem}#next{right:.4rem}
  #lbHint{text-align:center;color:var(--dim);font-size:.75rem;
    padding:.45rem;border-top:1px solid #17241f}
</style>
</head>
<body>
<div id="topbar">
  <span id="brand">HARMONIA<small>normalize</small></span>
  <input id="search" type="search" placeholder="filter…">
  <div class="seg" id="segFilter">
    <button data-f="all" class="on">All</button>
    <button data-f="std">Standard</button>
    <button data-f="work">Needs&nbsp;norm</button>
  </div>
  <select id="sort">
    <option value="name">name</option>
    <option value="date">date</option>
    <option value="size">size</option>
  </select>
  <button class="tbtn" id="buildBtn" title="normalize every finding">⚙ Normalize all</button>
  <span id="buildstat"></span>
  <span id="count"></span>
</div>
<div id="shell">
  <div id="sidebar"></div>
  <div id="gridwrap">
    <div id="crumbs"></div>
    <div id="grid"></div>
    <div id="empty" hidden></div>
  </div>
</div>

<div id="lightbox">
  <div id="lbTop">
    <span id="lbName"></span>
    <span id="lbNote"></span>
    <span id="lbCounter"></span>
    <button class="tbtn" id="lbClose">✕ Esc</button>
  </div>
  <div id="stage">
    <span class="nav" id="prev">‹</span>
    <span class="nav" id="next">›</span>
  </div>
  <div id="lbHint">← → navigate · Esc close · everything you see is a standard viewing format</div>
</div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const S = { dir:"", files:[], dirs:[], filter:"all", sort:"name",
            q:"", lb:-1 };

function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML;}
function human(n){const u=["B","KB","MB","GB"];let i=0;
  while(n>=1024&&i<3){n/=1024;i++}return n.toFixed(i?1:0)+" "+u[i];}
const fname = p => p.split("/").pop();
const fext  = p => (p.match(/\.([a-z0-9]+)$/i)||[,""])[1].toUpperCase();

async function jget(path){
  const r = await fetch(path);
  const j = await r.json();
  if(!j.ok) throw new Error(j.error||("http "+r.status));
  return j.data;
}

/* ---------------- sidebar ---------------- */
async function loadDirs(){
  try{
    const d = await jget("/api/dirs");
    S.dirs = d.dirs;
    const sb = $("#sidebar");
    sb.innerHTML = "";
    for(const rel of d.dirs){
      const el = document.createElement("div");
      el.className = "fnode"+(rel===S.dir?" sel":"");
      const depth = rel ? rel.split("/").length-1 : 0;
      el.style.paddingLeft = (.5+depth*.85)+"rem";
      el.textContent = "▸ "+(rel ? fname(rel) : "⌂ root");
      el.onclick = ()=>go(rel);
      sb.appendChild(el);
    }
  }catch(e){ console.warn(e); }
}

/* ---------------- grid ---------------- */
function go(dir){ location.hash = "#/"+(dir||""); }

async function loadDir(){
  const data = await jget("/api/tree?dir="+encodeURIComponent(S.dir));
  S.files = data.files;
  crumbs();
  render();
}

function crumbs(){
  const c=$("#crumbs"); c.innerHTML="";
  const parts = S.dir ? S.dir.split("/") : [];
  let acc="";
  const mk=(label,rel,last)=>{
    const s=document.createElement("span");
    s.className="crumb"+(last?" last":""); s.textContent=label;
    s.onclick=()=>!last&&go(rel); c.appendChild(s);
  };
  mk("⌂ "+ROOTNAME,"",false);
  parts.forEach((p,i)=>{ acc=acc?acc+"/"+p:p; mk("⁄"); mk(p,acc,i===parts.length-1); });
}

function viewOf(f){
  // The format you actually GET from /api/file?v=1
  if(f.kind==="image") return ["jpg","jpeg","jfif"].includes(f.fmt.toLowerCase())?"JPG":f.fmt.toUpperCase()==="SVG"?"SVG":["PNG","GIF"].includes(f.fmt.toUpperCase())?f.fmt.toUpperCase():"JPG";
  return "MP4";
}

function visibleFiles(){
  let out=[...S.files];
  if(S.filter==="std")   out=out.filter(f=>f.std);
  if(S.filter==="work")  out=out.filter(f=>!f.std);
  if(S.q) { const q=S.q.toLowerCase();
    out=out.filter(f=>fname(f.path).toLowerCase().includes(q)); }
  const by={name:(a,b)=>fname(a.path).toLowerCase()<fname(b.path).toLowerCase()?-1:1,
            date:(a,b)=>b.mtime-a.mtime, size:(a,b)=>b.size-a.size};
  return out.sort(by[S.sort]);
}

function render(){
  const g=$("#grid"); g.innerHTML="";
  const files=visibleFiles();
  $("#count").textContent=`${files.length} item${files.length===1?"":"s"}`
      +(S.files.length!==files.length?` of ${S.files.length}`:"");
  $("#empty").hidden = files.length>0;
  $("#empty").innerHTML = S.files.length? "<b>nothing matches</b> this filter"
    : "<b>no media here</b><br>pick a folder or run ⚙ Normalize all";
  for(const [i,f] of files.entries()){
    const fig=document.createElement("figure");
    fig.className="tile"; fig.dataset.i=i;
    const src="/api/thumb?f="+encodeURIComponent(f.path);
    if(f.kind==="image"){
      const im=document.createElement("img");
      im.loading="lazy"; im.src=src; fig.appendChild(im);
    }else{
      const ph=document.createElement("div");
      ph.className="ph"; ph.textContent="🎞"; fig.appendChild(ph);
    }
    const cap=document.createElement("figcaption");
    cap.textContent=fname(f.path); fig.appendChild(cap);
    const b=document.createElement("span");
    b.className="badge "+badgeClass(f);
    b.textContent=viewOf(f)+(f.std?"":" ✓norm");
    fig.appendChild(b);
    fig.onclick=()=>openLb(files,i);
    g.appendChild(fig);
  }
}

function badgeClass(f){
  if(f.std) return "std";                 // already standard
  return "conv";                          // normalized deliverable ready/queued
}

/* ---------------- lightbox ---------------- */
const stage=$("#stage");
let lbFiles=[], lbNode=null;

function openLb(files,i){
  lbFiles=files; S.lb=i; show(); $("#lightbox").classList.add("on");
}
function closeLb(){ $("#lightbox").classList.remove("on");
  if(lbNode){lbNode.remove();lbNode=null;} }
function show(){
  if(S.lb<0||S.lb>=lbFiles.length) return;
  const f=lbFiles[S.lb];
  if(lbNode) lbNode.remove();
  if(f.kind==="image"){
    lbNode=document.createElement("img");
    lbNode.src="/api/file?f="+encodeURIComponent(f.path)+"&v=1&k=image";
  }else{
    lbNode=document.createElement("video");
    lbNode.controls=true; lbNode.autoplay=true;
    lbNode.src="/api/file?f="+encodeURIComponent(f.path)+"&v=1&k=video";
  }
  stage.insertBefore(lbNode,$("#next"));
  $("#lbName").textContent=fname(f.path);
  $("#lbNote").textContent = f.std ? `${f.fmt.toUpperCase()} · native standard`
                                   : `${f.fmt.toUpperCase()} → ${viewOf(f)} · normalized`;
  $("#lbCounter").textContent=`${S.lb+1} / ${lbFiles.length}`;
}

$("#prev").onclick=()=>{S.lb=(S.lb-1+lbFiles.length)%lbFiles.length;show();};
$("#next").onclick=()=>{S.lb=(S.lb+1)%lbFiles.length;show();};
$("#lbClose").onclick=closeLb;
document.addEventListener("keydown",e=>{
  if(!$("#lightbox").classList.contains("on")) return;
  if(e.key==="Escape") closeLb();
  if(e.key==="ArrowLeft") $("#prev").click();
  if(e.key==="ArrowRight") $("#next").click();
});

/* ---------------- controls ---------------- */
$("#search").oninput=e=>{S.q=e.target.value.trim();render();};
$("#segFilter").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  document.querySelectorAll("#segFilter button")
    .forEach(x=>x.classList.toggle("on",x===b));
  S.filter=b.dataset.f; render();
});
$("#sort").onchange=e=>{S.sort=e.target.value;render();};

/* ---------------- build ---------------- */
let pollTimer=null;
$("#buildBtn").onclick=async()=>{
  try{
    const st=await fetch("/api/build",{method:"POST"}).then(r=>r.json());
    if(st.ok){ watchBuild(st.data); }
  }catch(e){ $("#buildstat").textContent=e.message; }
};
async function watchBuild(first){
  $("#buildBtn").classList.add("on");
  const tick=async()=>{
    try{
      const st=await jget("/api/build");
      $("#buildstat").textContent =
        `done ${st.done}${st.failed?" · failed "+st.failed:""}`
        +(st.queued?` · queued ${st.queued}`:"")
        +(st.running?" · "+fname(st.running):"");
      if(st.queued===0&&!st.running){
        $("#buildBtn").classList.remove("on");
        clearInterval(pollTimer); pollTimer=null;
        loadDir();                       // refresh std flags
        setTimeout(()=>{$("#buildstat").textContent=
          `✓ ${st.done} normalized${st.failed?" · "+st.failed+" failed":""}`;},400);
      }
    }catch(e){ clearInterval(pollTimer);pollTimer=null; }
  };
  if(first) $("#buildstat").textContent=`queued ${first.enqueued}`;
  if(!pollTimer) pollTimer=setInterval(tick,1200);
}

/* ---------------- boot ---------------- */
let ROOTNAME="root";
(async function boot(){
  try{
    const info=await jget("/api/info");
    ROOTNAME=info.root_name;
    document.title=`HARMONIA · ${ROOTNAME}`;
  }catch(e){}
  function route(){ S.dir=decodeURIComponent(
    (location.hash.replace(/^#\//,"")||"")); loadDirs(); loadDir(); }
  addEventListener("hashchange",route);
  route();
})();
</script>
</body>
</html>
