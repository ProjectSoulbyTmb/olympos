<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Riley Studio - Models</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    body { padding: 16px 18px; overflow-y: auto; }
    h2 { margin: 0 0 4px; }
    #list { display: grid; gap: 14px; margin-top: 14px;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); }
    .model { background: var(--bg2); border: 1px solid var(--line);
             border-radius: 10px; padding: 12px 14px; }
    .head { display: flex; justify-content: space-between; gap: 10px;
            align-items: baseline; }
    .badge { font-size: 11px; color: var(--dim); border: 1px solid
             var(--line); border-radius: 9px; padding: 1px 8px;
             white-space: nowrap; }
    .badge.ok { color: var(--ok); border-color: var(--ok); }
    .badge.vid { color: #6fc3ff; border-color: #6fc3ff; }
    .notes { color: var(--dim); font-size: 12px; margin-top: 6px; }
    .notes.err { color: var(--bad); }
    ul { margin: 8px 0 0; padding-left: 18px; color: var(--dim);
         font-size: 12px; }
    .bar { height: 6px; background: var(--bg3); border-radius: 3px;
           margin-top: 10px; overflow: hidden; }
    .bar i { display: block; height: 100%; background: var(--accent); }
  </style>
</head>
<body>
  <h2>Models</h2>
  <div class="hint" id="vram">detecting…</div>
  <div id="list"></div>
  <div id="state" class="status"></div>
  <script src="models.js"></script>
</body>
</html>
