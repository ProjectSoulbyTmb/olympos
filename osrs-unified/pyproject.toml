[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osrs-unified"
version = "1.2.0"
description = "OSRS research suite: LLM skilling agent + self-play PPO PvP agent, local simulation only"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Earth949" }]
keywords = ["osrs", "reinforcement-learning", "ppo", "llm-agent", "simulation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26,<3",
    "torch>=2.0",
]

[project.optional-dependencies]
dev = ["build>=1.0", "pytest>=8"]

[project.scripts]
osrs = "osrs_cli:main"

# Flat layout: explicit discovery, multiple top-level packages on purpose.
[tool.setuptools]
packages = [
    "agent", "game", "server",
    "algo", "envs", "rsps_adapter",
    "tools", "wiki", "knowledge", "strategies",
]
py-modules = ["bench", "train", "evaluate", "osrs_cli"]

[tool.setuptools.package-data]
wiki = ["*.md"]
knowledge = ["*.md", "*.json", "live/*", "raw/*"]
strategies = ["*.py"]
tools = ["update_knowledge.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
