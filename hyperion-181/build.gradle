plugins {
    id 'java'
}

group = 'com.soultechno'
version = '0.1.0'

java {
    toolchain {
        // Hyperion-181 target: Java 11 LTS.
        languageVersion = JavaLanguageVersion.of(11)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Networking: Netty 4.1.x replaces legacy Apache MINA (Hyperion 2009).
    implementation 'io.netty:netty-all:4.1.100.Final'

    // Memory-caching primitives (per-cycle update block caches).
    implementation 'com.google.guava:guava:31.1-jre'

    // JSON asset configuration (revision profiles, definition tables).
    implementation 'com.google.code.gson:gson:2.10.1'

    // OpenRS2 standard cache FileStore reading.
    implementation 'org.openrs2:openrs2-cache:0.1.0-SNAPSHOT'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 11
}

test {
    useJUnitPlatform()
}
